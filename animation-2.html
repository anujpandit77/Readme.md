<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation-2</title>
    <style>
        .box{
            height:100px;
            width:100px;
            margin:10px;
            background-color:lightcoral;
            border:2px solid black;
            border-radius:5px;
            position:relative;
            top:100px;
            left:100px;

            animation-name:visitor-2;
            animation-duration:2s;
            animation-timing-function:ease-in-out;
            animation-delay:1s;
            animation-iteration-count:infinite;
            animation-direction:alternate-reverse;      
        }
        .box:hover{
            background-color:darkred;
        }

            @keyframes visitor-2{
                0%{
                    left:10px;
                }
                50%{
                    left:500px;
                }
                160%{
                    left:180px;
                }
                200%{
                    left:200px;
                }
            }
        
    </style>
</head>
<body>
    <div class="box">Animate</div>
     <div class="box">Animate</div>
      <div class="box">Animate</div>
</body>
</html>
