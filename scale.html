<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-Transform: scale</title>
    <style>
        .box{
            height:100px;
            width:100px;
            margin:40px;
            background-color:deepskyblue;
            border:2px solid black;
            border-radius:3px;
            position:relative;
            top:30px;
            left:30px;
            transition-duration:1s;
            transition-delay:1s;

        }
        .box:hover{
            background-color:deeppink;
            transform:scale(2);
            
        }
        .box:active{
            background-color:red;
        }
    </style>
</head>
<body>
    <div class="box">Scale</div>
</body>
</html>
