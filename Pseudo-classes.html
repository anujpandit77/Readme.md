<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo classes</title>
    <style>
        .pseudo {
            height:25px;
            width:160px;
            background-color:green;
            border:2px solid black;
            border-radius:5px;
        }
        .pseudo:hover {
            height:50px;
            width:160px;
            background-color:goldenrod;
        }
        .pseudo:active {
            height:50px;
            width:160px;
            background-color:hotpink;
        }
    </style>
</head>
<body>
    <buttom class="pseudo">learning-pseudo</buttom>
</body>
</html>
