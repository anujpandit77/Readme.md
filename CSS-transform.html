<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-Transform</title>
    <style>
        .box1{
            height:80px;
            width:80px;
            padding:10px;
            border:1px solid black;
            background-color:hotpink;
            margin:60px;
            border-radius:10px;
            
            position:relative;
            top:50px;
            left:50px;

            transform:rotate(45deg);
            transition:all 2s ease-in;
            
        }
        .box2{
            height:80px;
            width:80px;
            margin:100px;
            border:1px solid black;
            background-color:aqua;
            border-radius:10px;

            transform:rotate(60deg);
 
        }
        .box2:hover{
            transition-duration:1s;
            transform:rotatex(45deg);
            background-color:red;
        }
        .box3{
            height:80px;
            width:80px;
            margin:100px;
            border:1px solid black;
            border-radius:10px;
            background-color:brown;

           
        }
        .box3:hover{
            height:60px;
            background-color:green;
            transform:rotatey(45deg);
        }
        .box4{
            height:80px;
            width:80px;
            margin:100px;
            border:1px solid black;
            border-radius:10px;
            background-color:darkgreen;

            transform:rotate(245deg);
            transition-duration:2s;
        }
        .box4:hover{
            background-color:greenyellow;
            transform:rotatez(45deg);
        }
       
    </style>
</head>
<body>
    <div class="box1">rotate1</div>
    <div class="box2">rotate2</div>
    <div class="box3">rotate3</div>
    <div class="box4">rotate4</div>
</body>
</html>
